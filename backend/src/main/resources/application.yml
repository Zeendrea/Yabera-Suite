server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yabera_suite}?createDatabaseIfNotExist=true&useSSL=true&requireSSL=true&sslMode=REQUIRED&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:${DB_PASS:claireandrea}}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1700000
      keepalive-time: 300000
      leak-detection-threshold: 20000
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Manila
    show-sql: false
yabera:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:yabera-admin-2026}
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-for-yabera-suite}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:https://yabera-suite.vercel.app,http://localhost:5173,http://127.0.0.1:5173}
  property:
    name: ${PROPERTY_NAME:Yabera Suite}
logging:
  level:
    com.yaberasuite: INFO

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    db:
      enabled: true
