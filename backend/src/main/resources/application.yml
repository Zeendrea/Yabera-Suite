server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:yabera_suite}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila}
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:${DB_PASS:claireandrea}}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          time_zone: Asia/Manila
    show-sql: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            trust: smtp.gmail.com
        debug: false

yabera:
  admin:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:yabera-admin-2026}
  jwt:
    secret: ${JWT_SECRET:change-this-to-a-long-random-secret-key-for-yabera-suite}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  property:
    name: ${PROPERTY_NAME:Yabera Suite}
  mail:
    from: ${MAIL_FROM:noreply@yaberasuite.com}
    admin-address: ${MAIL_ADMIN_ADDRESS:}
    qr-path: ${YABERA_PAYMENT_QR_PATH:}

logging:
  level:
    com.yaberasuite: INFO
